services:

  n8n:
    image: n8nio/n8n:latest
    container_name: saha-n8n
    restart: unless-stopped

    ports:
      - "7000:5678"

    environment:
      # n8n
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:7000

      # Timezone
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
      TZ: ${TZ}

      # Local development
      N8N_SECURE_COOKIE: "false"

    volumes:
      - ./n8n_data:/home/node/.n8n